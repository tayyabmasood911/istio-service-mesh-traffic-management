apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-access-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: api-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/frontend-gateway-sa"]
    to:
    - operation:
        methods: ["GET", "POST"]
        paths: ["/api/v1/*", "/api/v2/*", "/healthz"]
